<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Koperasi BJB Banner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: #021B79;
      color: #ffffff;
    }
    
    .container {
      position: relative;
      width: 1024px;
      height: 500px;
      display: flex;
      background: linear-gradient(135deg, #091E60 0%, #002B9A 50%, #0052D4 100%);
    }
    
    /* Subtle background grid pattern for high tech / premium look */
    .bg-pattern {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.08;
      background-image: radial-gradient(#ffffff 1px, transparent 1px);
      background-size: 20px 20px;
      z-index: 1;
      pointer-events: none;
    }
    
    /* Left side content */
    .left-side {
      width: 55%;
      height: 100%;
      padding: 48px 0 48px 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .logo-container {
      width: 64px;
      height: 64px;
      background: #ffffff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    .logo-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    
    .brand-info {
      display: flex;
      flex-direction: column;
    }
    
    .brand-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
      line-height: 1.1;
    }
    
    .brand-subtitle {
      font-size: 11px;
      font-weight: 600;
      color: #9EC5FF;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }
    
    .main-content {
      margin-top: -10px;
    }
    
    .headline {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 16px;
      text-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    
    .headline span {
      background: linear-gradient(90deg, #00F2FE 0%, #4FACFE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    
    .tagline {
      font-size: 15px;
      color: #D2E3FC;
      line-height: 1.6;
      max-width: 480px;
      font-weight: 400;
    }
    
    .footer {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    
    .badge-container {
      display: flex;
      align-items: center;
    }
    
    .ojk-logo {
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }
    
    .divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.2);
    }
    
    .download-text {
      font-size: 12px;
      color: #9EC5FF;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.5px;
    }
    
    .download-text::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #00F2FE;
      border-radius: 50%;
      box-shadow: 0 0 8px #00F2FE;
    }

    /* Right side illustration with diagonal clip path */
    .right-side {
      position: absolute;
      right: 0;
      top: 0;
      width: 50%;
      height: 100%;
      background: #CDE5FD;
      clip-path: polygon(18% 0, 100% 0, 100% 100%, 0 100%);
      display: flex;
      align-items: center;
      justify-content: flex-end; /* Align image to the right */
      overflow: hidden;
      z-index: 2;
    }
    
    .illustration-img {
      width: 110%;
      height: 110%;
      object-fit: cover;
      object-position: center right; /* Focus on the center-right part of the illustration */
      transform: translate(15px, 25px); /* Micro-positioning to align characters beautifully */
    }
    
    /* Decorative glowing lines on the border split */
    .split-line {
      position: absolute;
      top: 0;
      left: 50%; /* Aligns with split start */
      width: 6px;
      height: 100%;
      background: linear-gradient(to bottom, #00F2FE, #4FACFE);
      transform: skewX(-10.2deg); /* Mathematically skewing to match polygon(18% 0, 100% 0, 100% 100%, 0 100%) on a 512px wide right-side. 18% of 512px = 92px. Skew is arctan(92/500) = ~10.4 degrees. */
      transform-origin: top left;
      z-index: 3;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.8), -2px 0 10px rgba(0, 0, 0, 0.3);
      margin-left: 90px; /* Offset to align with the clip path start */
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="bg-pattern"></div>
    
    <div class="left-side">
      <div class="header">
        <div class="logo-container">
          <img class="logo-img" src="src/assets/images/logo.png" alt="Logo Koperasi BJB">
        </div>
        <div class="brand-info">
          <span class="brand-name">KOPERASI BJB</span>
          <span class="brand-subtitle">PT. Bare Jaya Berdikari</span>
        </div>
      </div>
      
      <div class="main-content">
        <h1 class="headline"><span>Solusi Digital</span><br>Koperasi Modern</h1>
        <p class="tagline">Akses informasi pinjaman aktif, rincian tagihan harian, serta dapatkan bukti tanda terima pembayaran digital secara real-time dan transparan.</p>
      </div>
      
      <div class="footer">
        <div class="badge-container">
          <img class="ojk-logo" src="src/assets/images/ojk.png" alt="Logo OJK">
        </div>
        <div class="divider"></div>
        <div class="download-text">
          Portal Anggota Resmi
        </div>
      </div>
    </div>
    
    <!-- Diagonal glowing border -->
    <div class="split-line"></div>
    
    <!-- Right side illustration -->
    <div class="right-side">
      <img class="illustration-img" src="src/assets/images/onboarding_1.jpg" alt="Onboarding Illustration">
    </div>
  </div>
</body>
</html>
